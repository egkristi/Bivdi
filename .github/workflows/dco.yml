name: dco

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dco:
    name: Developer Certificate of Origin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the actual PR head, not the synthetic merge commit
          # (which would itself fail the sign-off check).
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Check DCO sign-off
        run: |
          # Verify every commit in this PR (not in the base) carries a
          # Signed-off-by line. This enforces LICENSING.md §3 (DCO, no CLA).
          set -euo pipefail
          range="${{ github.event.pull_request.base.sha }}..HEAD"
          fail=0
          for sha in $(git rev-list "$range"); do
            if ! git log -1 --format='%B' "$sha" | grep -q '^Signed-off-by: '; then
              echo "::error::Commit $sha is missing a Signed-off-by trailer"
              fail=1
            fi
          done
          exit "$fail"
