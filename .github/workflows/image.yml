name: image

# Publishes the Runtime as a container image so that trying Bivdi is a single
# command rather than a Rust toolchain and a five-minute build. `D-013`: the
# container is a deployment convenience, never a Bivdi primitive.

on:
  push:
    branches: [main]
    tags: ['v*']
  # Build on pull requests too, so a broken Containerfile fails in review
  # rather than after merge. Pull-request builds are never pushed.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/bivdi

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Only authenticate when the image will actually be pushed; a pull
      # request from a fork has no credentials and must still build.
      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is the thing a first-time visitor runs, so a build that
      # produces a broken entrypoint is worse than no image at all.
      - name: Smoke-test the published image
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          ref="${{ env.REGISTRY }}/${{ env.IMAGE }}:latest"
          docker pull "$ref"
          for cmd in "" scenario wasm sandbox; do
            echo "--- bivdi-cli $cmd"
            docker run --rm "$ref" $cmd > /dev/null
          done
          echo "all entrypoint subcommands ran"
