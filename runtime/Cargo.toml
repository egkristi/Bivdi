[workspace]
resolver = "2"
members = ["crates/bivdi-object", "crates/bivdi-cap", "crates/bivdi-state", "crates/bivdi-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
rust-version = "1.75"

[workspace.dependencies]
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
