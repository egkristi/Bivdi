[package]
name = "bivdi-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Bivdi WASI runtime: execute WASI components as native applications"

[dependencies]
# Pinned to the 36.x line: it patches every RustSec advisory affecting the
# 20.x line (including multiple sandbox escapes — unacceptable for an agent
# execution host) while keeping an MSRV of 1.86, within the workspace 1.88.
wasmtime = "48"
wasmtime-wasi = "36"

[dev-dependencies]
wat = "1"
